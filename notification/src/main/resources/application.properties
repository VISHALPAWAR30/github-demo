spring.application.name=notification-service
server.port=8086

spring.data.mongodb.uri=mongodb://localhost:27017/digital-wallet-notifications
logging.level.org.springframework.data.mongodb=DEBUG

spring.kafka.bootstrap-servers=localhost:9092

# Consumer Config
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Tell consumer which class to map JSON into
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.notification.model.NotificationEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
